# KABURI timing predictor config.
#

#
# NOTE: this file describes the model used at inference.  Training data and
# training settings are not included in this repository.

data:
  # 学習データの manifest は本リポジトリには含まれない (推論では使用しない)。
  utt_timing_jsonls: []
  phone_vocab_path: "assets/phone_vocab.json"
  utt_manifest_path: null
  latent_T: 750
  max_text_len: 64

context:
  phone_vocab_size: 79
  phone_emb_dim: 128
  utt_boundary_emb_dim: 16
  speaker_emb_dim: 64
  channel_emb_dim: 16
  n_speakers_max: 100
  max_collapsed_seq_len: 512

timing:
  T_frames: 750
  max_timing_seq_len: 1024
  tau_soft_boundary: 2.0

model:
  phone_vocab_size: 80
  n_speakers_max: 100
  hidden: 192
  layers: 2
  heads: 4
  ff_dim: 768
  dropout: 0.1
  max_pos: 1024
  use_text: true
  text_vocab_size: 100000
  text_emb_dim: 64
  max_utt_text_len: 64
  use_utt_context: true
  use_dialog_order_context: true
  utt_context_layers: 1
  max_dialog_pos: 256
