const A_CONDS = ["kaburi_gt", "kaburi_pred"];
const B_CONDS = ["kaburi_pred", "kaburi_stat", "moss_ttsd", "firered_tts2"];
let LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ja";

function setLang(l) {
  LANG = l;
  const url = new URL(location);
  url.searchParams.set("lang", l);
  history.replaceState(null, "", url);
  render();
}

function render() {
  const t = I18N[LANG];
  document.documentElement.lang = LANG;
  document.getElementById("btn-ja").classList.toggle("active", LANG === "ja");
  document.getElementById("btn-en").classList.toggle("active", LANG === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;  // i18n 文字列は自前資産のみ (リンク許可)
  });
  const vs = window.SAMPLES.voices || [];
  document.getElementById("voices-section").style.display = vs.length ? "" : "none";
  if (vs.length) buildVoicesTable("table-voices", vs);
  buildTable("table-chunk", window.SAMPLES.chunk_input, A_CONDS);
  buildTable("table-text", window.SAMPLES.text_input, B_CONDS);
}

function buildVoicesTable(id, voices) {
  const t = I18N[LANG];
  const tbl = document.getElementById(id);
  const src = v => (typeof v === "string" ? v : v.src);
  const label = (v, i) => (typeof v === "string" ? `${t.voice} ${i + 1}`
                           : `${t.voice} ${i + 1} <span class="grp">${v.label}</span>`);
  let html = "";
  for (let r = 0; r < voices.length; r += 3) {
    const row = voices.slice(r, r + 3);
    html += "<tr>" + row.map((v, j) => `<th>${label(v, r + j)}</th>`).join("") + "</tr>";
    html += "<tr>" + row.map(v =>
      `<td><audio controls preload="none" src="${src(v)}" style="width:100%;min-width:220px"></audio></td>`).join("") + "</tr>";
  }
  tbl.innerHTML = html;
}

function buildTable(id, samples, conds) {
  const t = I18N[LANG];
  const tbl = document.getElementById(id);
  let html = "<tr><th></th>" + conds.map(c => `<th>${t.conds[c]}</th>`).join("") + "</tr>";
  samples.forEach((s, i) => {
    let head = `${t.sample} ${i + 1}`;
    if (s.voices) {
      head += `<br><span class="grp">${t.voice}: ${s.voices}</span>`;
    }
    if (s.text) {
      head += `<details class="dtext"><summary>${t.input_text}</summary><pre>${(Array.isArray(s.text) ? s.text : String(s.text).split("\n")).join("\n")}</pre></details>`;
    }
    html += `<tr><td class="rowhead">${head}</td>` + conds.map(c =>
      `<td><audio controls preload="none" src="${s.audio[c]}"></audio></td>`).join("") + "</tr>";
  });
  tbl.innerHTML = html;
}

function fmtTime(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function initHero(){
  const items=(window.SAMPLES&&window.SAMPLES.text_input)||[];
  const feat=items.find(x=>x.id==="sample05")||items[0];
  if(!feat||!feat.audio||!feat.audio.kaburi_pred)return;
  const src=feat.audio.kaburi_pred;
  const ht=document.getElementById("heroText");
  if(ht)ht.textContent=(Array.isArray(feat.text)?feat.text:String(feat.text||"").split("\n")).join("\n");
  const canvas=document.getElementById("heroWave"),btn=document.getElementById("heroPlay"),
        timeEl=document.getElementById("heroTime");
  if(!canvas||!btn)return;
  const audio=new Audio();audio.src=src;audio.preload="metadata";
  const N=560;let peaks=null,dur=0;
  const css=v=>(getComputedStyle(document.documentElement).getPropertyValue(v)||'').trim();
  fetch(src).then(r=>r.arrayBuffer()).then(b=>{const AC=window.AudioContext||window.webkitAudioContext;return new AC().decodeAudioData(b);})
    .then(ab=>{peaks=computePeaks(ab);dur=ab.duration;draw(0);}).catch(()=>{});
  function computePeaks(ab){
    const a=ab.getChannelData(0),b=ab.numberOfChannels>1?ab.getChannelData(1):a;
    const len=a.length,step=Math.max(1,Math.floor(len/N));
    const A=new Float32Array(N),B=new Float32Array(N),aA=new Uint8Array(N),bA=new Uint8Array(N);
    for(let i=0;i<N;i++){let pa=0,pb=0,ra=0,rb=0,c=0;
      for(let j=i*step;j<(i+1)*step&&j<len;j++){const va=Math.abs(a[j]),vb=Math.abs(b[j]);if(va>pa)pa=va;if(vb>pb)pb=vb;ra+=a[j]*a[j];rb+=b[j]*b[j];c++;}
      A[i]=pa;B[i]=pb;aA[i]=Math.sqrt(ra/(c||1))>0.012?1:0;bA[i]=Math.sqrt(rb/(c||1))>0.012?1:0;}
    return {A,B,aA,bA};
  }
  function draw(prog){
    const dpr=window.devicePixelRatio||1,W=canvas.clientWidth||760,H=canvas.clientHeight||132;
    canvas.width=W*dpr;canvas.height=H*dpr;const g=canvas.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,W,H);const mid=H/2,cw=W/N;
    if(peaks)for(let i=0;i<N;i++)if(peaks.aA[i]&&peaks.bA[i]){g.fillStyle="rgba(122,62,157,0.15)";g.fillRect(i*cw,0,cw+0.6,H);}
    g.strokeStyle="#e8e8e8";g.beginPath();g.moveTo(0,mid);g.lineTo(W,mid);g.stroke();
    if(peaks){const cA=css('--chA')||'#1d6fe0',cB=css('--chB')||'#e23b2e';
      g.fillStyle=cA;for(let i=0;i<N;i++){const h=peaks.A[i]*(mid-3);g.fillRect(i*cw,mid-h,Math.max(cw-0.5,0.6),h);}
      g.fillStyle=cB;for(let i=0;i<N;i++){const h=peaks.B[i]*(mid-3);g.fillRect(i*cw,mid,Math.max(cw-0.5,0.6),h);}}
    const x=Math.min(W,Math.max(0,prog*W));g.strokeStyle="rgba(20,20,20,0.6)";g.lineWidth=1.5;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();
  }
  function loop(){if(audio.paused)return;const p=dur?audio.currentTime/dur:0;draw(p);
    timeEl.textContent=fmtTime(audio.currentTime)+" / "+fmtTime(dur||audio.duration);requestAnimationFrame(loop);}
  btn.onclick=()=>{if(audio.paused){audio.play();btn.innerHTML="&#10073;&#10073;";loop();}else{audio.pause();btn.innerHTML="&#9654;";}};
  audio.onended=()=>{btn.innerHTML="&#9654;";draw(0);timeEl.textContent="0:00 / "+fmtTime(dur||audio.duration);};
  audio.onloadedmetadata=()=>{if(!dur)dur=audio.duration;timeEl.textContent="0:00 / "+fmtTime(audio.duration);};
  window.addEventListener("resize",()=>draw(dur?audio.currentTime/dur:0));
}
render();
initHero();
</script>
</body>
